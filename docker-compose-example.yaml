version: '3.8'
services:
  postgres:
    image: bitnami/postgresql
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sushi
    restart: unless-stopped
    networks:
      - backend

  sushi-backend:
    build:
      context: ./backend
    container_name: sushi-backend
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - LOG_LEVEL=Debug
      - JWT_SECRET=secret123
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=sushi
      - MIGRATE_DB=true
      # Update callback URLs to use new domain
      - GOOGLE_CLIENT_ID=
      - GOOGLE_CLIENT_SECRET=
      - GOOGLE_REDIRECT_URL=http://localhost:8080/api/v1/auth/callback
      - GITHUB_CLIENT_ID=
      - GITHUB_CLIENT_SECRET=
      - GITHUB_REDIRECT_URL=http://localhost:8080/api/v1/auth/callback
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
    container_name: sushi-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://sushi-backend:8080
    depends_on:
      - sushi-backend
    restart: unless-stopped
    networks:
      - backend

  caddy:
    build:
      context: ./caddy
    container_name: caddy
    ports:
      - "8080:8080"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - sushi-backend
    networks:
      - backend
    restart: always
    user: root

volumes:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge