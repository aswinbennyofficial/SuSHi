version: '3.8'
services:
  postgres:
    image: bitnami/postgresql
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sushi
    restart: unless-stopped
    volumes:
      - postgres:/bitnami/postgresql/data
    networks:
      - backend

  sushi-backend:
    build:
      context: ./backend
    container_name: sushi-backend
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - LOG_LEVEL=Debug
      - JWT_SECRET=secret123
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=sushi
      - MIGRATE_DB=true
      # Update callback URLs to use new domain
      - GOOGLE_CLIENT_ID=188782029541-mp3dho0iq7tvjqmnptbha1t30i61lji0.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=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
      - GOOGLE_REDIRECT_URL=http://localhost:8080/api/v1/auth/callback
      - GITHUB_CLIENT_ID=Ov23lilhxa9zph0EhMjE
      - GITHUB_CLIENT_SECRET=4398d6cf674b60cbaca1ec21a4a730e0985f4ec9
      - GITHUB_REDIRECT_URL=http://localhost:8080/api/v1/auth/callback
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
    container_name: sushi-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://sushi-backend:8080
    depends_on:
      - sushi-backend
    restart: unless-stopped
    networks:
      - backend

  caddy:
    build:
      context: ./caddy
    container_name: caddy
    ports:
      - "8080:8080"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - sushi-backend
    networks:
      - backend
    restart: always
    user: root

volumes:
  caddy_data:
  caddy_config:
  postgres:

networks:
  backend:
    driver: bridge